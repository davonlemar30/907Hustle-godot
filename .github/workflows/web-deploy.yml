name: Deploy web build

# Publishes a phone-testable build to GitHub Pages on every push to main.
# Godot's web export runs without thread support (see export_presets.cfg), so it
# needs no SharedArrayBuffer and therefore no COOP/COEP headers -- which is what
# makes plain GitHub Pages a viable host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  glyphs:
    name: Check glyph coverage
    timeout-minutes: 10
    # A character no theme font carries renders fine in the editor (macOS lends a
    # system font) and as a tofu box in the browser (the export has none to lend).
    # Nothing downstream can see the difference, so it is caught here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - run: scripts/check_glyph_coverage.py --list

  parity:
    name: Behavioral parity
    # The parity suite is ~10 minutes. A parse error in `parity_runner.gd` HANGS
    # rather than fails, so an un-timed job on a broken script burns the runner's
    # full six-hour default before anybody learns anything.
    timeout-minutes: 40
    # Replays recorded oracle truth (tests/parity/fixtures/, generated by
    # scripts/parity/gen_fixtures.mjs against the web build) through the Godot
    # port: hash + xorshift primitives bit-for-bit, plus the save→scramble→load
    # round-trip that is Phase 4's acceptance test. A drifted primitive fails
    # the PR here, before it can merge.
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Drop editor-only MCP addon
        run: |
          sed -i '/_mcp_game_helper/d' project.godot
          sed -i '/addons\/godot_ai\/plugin.cfg/d' project.godot

      - name: Import resources
        run: godot --headless --import || true

      # `grep -q "^parity: PASS"`, which this step has been missing since it was
      # written — it was the only one of the three harnesses without it, and a
      # Godot run that dies part-way still exits 0. The other two steps below
      # already carried the same guard and say why.
      - name: Run parity suite
        run: |
          godot --headless --path . res://tests/parity/parity_runner.tscn 2>&1 | tee parity.log
          grep -q "^parity: PASS" parity.log

      # The other two harnesses, which were green and manual-only. A gate
      # nobody runs automatically is not a gate: `save_validation` is the
      # adversarial cover for every migration arm, and `screen_smoke`
      # instantiates and refreshes all 23 screens, which is the only thing in
      # the build that would catch a screen that cannot render.
      #
      # Both `grep` their own PASS line, because a Godot run that dies part-way
      # still exits 0. The smoke check matches N/N with a backreference rather
      # than a literal count, so adding a screen does not fail CI for the wrong
      # reason — only a screen that did not instantiate does.
      - name: Run save-validation suite
        run: |
          godot --headless --path . res://tests/save_validation/save_validation_runner.tscn 2>&1 | tee sv.log
          grep -q "^save_validation: PASS" sv.log

      # FS-002's own harness (`86bbjxtjb`). Seconds rather than the parity
      # runner's ten minutes, which is the whole reason it is a second suite —
      # FS-002 has twelve slices of coverage to add and the parity runner is
      # 20,288 lines. Same PASS-line contract as the other three.
      - name: Run territory suite
        run: |
          godot --headless --path . res://tests/territory/territory_runner.tscn 2>&1 | tee territory.log
          grep -q "^territory: PASS" territory.log

      - name: Run screen smoke
        run: |
          godot --headless --path . res://tests/smoke/screen_smoke.tscn 2>&1 | tee smoke.log
          grep -qE "screen smoke: ([0-9]+)/\1 instantiated" smoke.log
          ! grep -q "LOAD FAILED" smoke.log

      # The crash gate (86bbjxthk). Every harness above asserts its own PASS
      # line, and a PASS line only says the checks that RAN all passed.
      #
      # `screen_smoke.gd` calls `refresh()` on each screen and ignores every
      # error it raises: a runtime fault inside a refresh goes to stderr, the
      # screen still counts as instantiated, and the run still exits 0. That is
      # precisely how 86bbjxtab — an unguarded index that killed nightly
      # settlement outright — coexisted with 12,499 green checks and 24/24
      # screens for as long as it did.
      #
      # So stderr is a gate now. `SCRIPT ERROR` is Godot's prefix for an
      # uncaught GDScript fault and `Invalid access` is the specific one that
      # indexing an empty Dictionary raises. Neither appears in a clean run of
      # any of the three harnesses; both are checked against the logs the steps
      # above already tee'd, so this adds no runtime.
      - name: No script errors in any harness
        run: |
          if grep -nE "SCRIPT ERROR|Invalid access" parity.log sv.log territory.log smoke.log; then
            echo "::error::A harness raised a script error. A suite that crashed part-way is not a green suite - see the matched lines above."
            exit 1
          fi

  build:
    name: Export web
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Place export templates
        # The image ships templates under /root, but Actions overrides HOME to
        # /github/home, so Godot looks somewhere they aren't.
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ] \
             && [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
                  ~/.local/share/godot/export_templates/
          fi
          ls ~/.local/share/godot/export_templates/

      - name: Drop editor-only MCP addon
        # godot_ai is editor tooling. Its autoload dials a local WebSocket that
        # will never exist in a browser, so strip it from the shipped build.
        run: |
          sed -i '/_mcp_game_helper/d' project.godot
          sed -i '/addons\/godot_ai\/plugin.cfg/d' project.godot

      - name: Import resources
        # First import builds the .godot cache. It reports missing-dependency
        # noise on a cold cache; the export step is the real gate.
        run: godot --headless --import || true

      - name: Export release
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Stamp the build version into the HTML shell
        # Godot writes <title> from config/name, which carries no version. The
        # deployed page is what a playtester has open, so the tab has to say
        # which build they are reporting against. autoload/version.gd is the one
        # source -- read, never retyped.
        run: |
          VERSION=$(sed -n 's/^const VERSION := "\(.*\)"$/\1/p' autoload/version.gd)
          test -n "$VERSION"
          sed -i "s#<title>.*</title>#<title>907Hustle v${VERSION}</title>#" build/web/index.html
          grep -o "<title>.*</title>" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          include-hidden-files: true

  deploy:
    name: Publish to Pages
    timeout-minutes: 15
    needs: build
    # Pull requests build but do not publish -- they exist to catch a broken
    # export before it reaches the live URL.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploying from a plain runner rather than the Godot container keeps the
      # Pages actions on their expected environment.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
